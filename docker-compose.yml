# Y-COMPS local/staging stack. For production, put this behind a real
# reverse proxy (nginx/Caddy) with TLS, and move secrets out of the
# committed .env into your platform's secret manager.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ycomps}
      POSTGRES_USER: ${DB_USER:-ycomps}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ycomps}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ycomps}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 ycomps.asgi:application"
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "0"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      # The frontend proxies /api/v1 and /ws to the Django backend below.
      # The host name must be resolvable from within the frontend container
      # (Docker's embedded DNS resolves the service name "web").
      NEXT_PUBLIC_API_BASE: http://web:8000
      NEXT_PUBLIC_WS_BASE: ws://web:8000
      # Firebase Cloud Messaging web config (public by design).
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyD1Vp4X2leDLlrasMw1Wt0LXxNF8_F1GNM"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dmd-ycomps.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dmd-ycomps"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dmd-ycomps.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "856330885194"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:856330885194:web:872e6cc89bf04461e0eeb3"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-J5FSECG7K2"
      # Optional — the Web Push public VAPID key from the Firebase console.
      # NEXT_PUBLIC_FIREBASE_VAPID_KEY: ""
    expose:
      - "3000"
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - web
      - frontend


  celery-worker:
    build: .
    command: celery -A ycomps worker -l info
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A ycomps beat -l info
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  static_volume:
  media_volume:
