# Y-COMPS reverse proxy.
#
# Serves the Next.js frontend from the `frontend` container for the public
# web routes, proxies the JSON API + WebSockets to the Django ASGI server
# (`web`), and serves Django media directly from the shared volume.
# For production, terminate TLS in front of this (DO load balancer, certbot,
# or a dedicated TLS entrypoint); see DEPLOYMENT.md.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream ycomps_frontend {
        server frontend:3000;
    }

    upstream ycomps_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Django media, served straight off the shared volume.
        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # JSON API -> Django.
        location /api/ {
            proxy_pass http://ycomps_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz/ {
            proxy_pass http://ycomps_web;
            proxy_set_header Host $host;
        }

        # WebSocket upgrade support for Channels (notifications, chat,
        # operations feed). Django validates auth via the JWT query token.
        location /ws/ {
            proxy_pass http://ycomps_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else -> Next.js (app shell + PWA static assets).
        location / {
            proxy_pass http://ycomps_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
